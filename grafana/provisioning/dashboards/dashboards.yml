# ==============================================================================
# Grafana Dashboards Provider Provisioning (Đề 5)
# ==============================================================================

apiVersion: 1

providers:
  - name: 'Inventory Monitoring Dashboards'
    orgId: 1
    folder: 'Inventory System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
