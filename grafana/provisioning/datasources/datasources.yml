# ==============================================================================
# Grafana Datasources Provisioning - Monitoring & Logging Stack (Đề 5)
# ==============================================================================

apiVersion: 1

datasources:
  # Metrics Data Source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # Logging Data Source
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
