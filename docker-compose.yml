version: '3.8'

# ==============================================================================
# Inventory Management System (Đề 5) - Full Docker Compose Stack
# DTC245190012
# Hardening: Network Isolation, Non-root User, Strict Access Controls
# ==============================================================================

networks:
  frontend:
    driver: bridge
    name: inventory_frontend_net
  backend:
    driver: bridge
    internal: true # Security hardening: isolated network with no direct host ingress
    name: inventory_backend_net
  monitoring:
    driver: bridge
    name: inventory_monitoring_net

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_logs:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: inventory_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuperRootSecurePass2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventory_db}
      MYSQL_USER: ${MYSQL_USER:-inventory_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-InventorySecurePass2024!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    # Port 3306 is not exposed to host for security hardening
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # PHP Web Application (PHP-FPM 8.2)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "www-data:www-data" # Hardening: unprivileged non-root user
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-inventory_db}
      DB_USER: ${MYSQL_USER:-inventory_user}
      DB_PASS: ${MYSQL_PASSWORD:-InventorySecurePass2024!}
    volumes:
      - ./src:/var/www/html:ro
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # phpMyAdmin Database Management
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1-apache
    container_name: inventory_phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-inventory_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-InventorySecurePass2024!}
      UPLOAD_LIMIT: 25M
      PMA_ABSOLUTE_URI: https://localhost/phpmyadmin/
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy with HTTPS & Security Headers
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: inventory_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_PORT_HTTP:-80}:80"
      - "${APP_PORT_HTTPS:-443}:443"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend
      - monitoring
    depends_on:
      - app
      - phpmyadmin
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/stub_status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # cAdvisor Container Metrics Exporter
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: inventory_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    networks:
      - monitoring

  # ----------------------------------------------------------------------------
  # Prometheus Time Series Metrics Database & Scraper
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: inventory_prometheus
    restart: unless-stopped
    user: "nobody" # Hardening: non-root user
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring
      - frontend
    depends_on:
      - cadvisor

  # ----------------------------------------------------------------------------
  # Grafana Visual Analytics & Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: inventory_grafana
    restart: unless-stopped
    user: "472:0" # Hardening: standard grafana non-root UID
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaSecurePass2024!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring
      - frontend
    depends_on:
      - prometheus

  # ----------------------------------------------------------------------------
  # Grafana Loki Log Aggregation Engine
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: inventory_loki
    restart: unless-stopped
    user: "10001:10001" # Hardening: non-root user
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring

  # ----------------------------------------------------------------------------
  # Promtail Log Shipper Agent
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: inventory_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
    ports:
      - "${PROMTAIL_PORT:-9080}:9080"
    networks:
      - monitoring
    depends_on:
      - loki
