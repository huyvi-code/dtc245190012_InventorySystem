# ==============================================================================
# Nginx Reverse Proxy Configuration with HTTPS & Security Headers
# Inventory Management System (Đề 5)
# ==============================================================================

# HTTP Server - Redirects all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Stub status for Prometheus metrics scraping
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Main Entry Point with TLS & Hardened Security Headers
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost _;

    # SSL Certificate & Private Key
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS Protocols & High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ==========================================================================
    # Security Headers Hardening
    # ==========================================================================
    # HSTS: Enforces HTTPS connections for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Cross-site scripting (XSS) filter
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Control referrer information sent in HTTP headers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (allows CDNs for Bootstrap, FontAwesome, ChartJS)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self';" always;
    
    # Restrict dangerous browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Root Directory for PHP Web Application
    root /var/www/html;
    index index.php index.html;

    # Route frontend requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI proxy
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }

    # Reverse Proxy: phpMyAdmin
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect / /phpmyadmin/;
    }

    # Reverse Proxy: Grafana Monitoring Dashboard
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse Proxy: Prometheus Metrics Server
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stub status for Prometheus metrics scraping
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Security: Deny access to sensitive hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
